<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dark and twisted google....</title>
<style>
  /* Everything you make goes inside #stage: exactly 800 × 400 pixels. The gallery shows
     this box (shrunk to fit), so anything outside it won't be seen. */
  html, body { margin: 0; background: #c53333; color: #260d0d; font: 16px/1.5 ui-monospace, Comic Sans MS, Comic Sans, cursive; }
  #stage {
    width: 800px; height: 400px; overflow: hidden; position: relative;
    display: grid; place-items: center; text-align: center;
    background: #c53333;
  }

  input {
    font: 16px "Comic Sans MS", "Comic Sans", cursive;
    width: 400px;
    padding: 12px 20px;
    border-radius: 24px;
    outline: none;
  }
  input:hover, input:focus {
    box-shadow: 0 1px 6px rgba(0, 0, 0, .4);
  }
  button {
    font: 14px "Comic Sans MS", "Comic Sans", cursive;
    padding: 10px 16px;
    margin-left: 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  #answer { font-size: 48px; color: #000000; }
  #logo {   height: 100px;}
</style>
</head>
<body>
<div id="stage">
 <div>
    <audio id="sound" src="Dracula Bach Organ.mp3"></audio>
    <img id="logo" src="evil google.png" alt="logo">  
    <br>
    <input id="q" placeholder="search...">
    <button id="go">definitely not an evil search.... normal and kind search....</button>
    <br>
    <img src="fireflames.gif" alt="fire" />
    <br>
    <img src="explosion.gif" alt="explodes" />
    <br>
    <p id="answer"></p>
  </div>
</div>
<script>
  // the example: delete this too
  document.getElementById('go').addEventListener('click', () => {
    document.getElementById('answer').textContent = 'EVIL RESPONSE!!!!!';
    document.getElementById('sound').play();
  });
</script>
</body>
</html>
