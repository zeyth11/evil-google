<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dark and twisted google....</title>
<style>
  /* Everything you make goes inside #stage: exactly 800 × 400 pixels. The gallery shows
     this box (shrunk to fit), so anything outside it won't be seen. */
  html, body { margin: 0; background: #292b47; color: #eceae3; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #stage {
    width: 800px; height: 400px; overflow: hidden; position: relative;
    display: grid; place-items: center; text-align: center;
    background: #23243d;
  }

  /* ---- the example below: delete it and build your own ---- */
  button { font: inherit; color: inherit; background: #3f4168; border: 0; border-radius: 6px; padding: .6rem 1.2rem; cursor: pointer; }
  .hint { color: #8d8aa6; font-size: 14px; }
</style>
</head>
<body>
<div id="stage">
  <!-- example evil input: volume you have to pump up by hand, and it leaks back down -->
  <div>
    <button id="click">CLICK TO BECOME EVIL!!</button>
    <p class="hint">terms and coniditions apply.</p>
  </div>
</div>
<script>
  // the example: delete this too
  let volume = 0;
  const out = document.getElementById('vol');
  document.getElementById('pump').addEventListener('click', () => {
    volume = Math.min(100, volume + 7);
    out.textContent = Math.round(volume);
  });
  setInterval(() => {
    volume = Math.max(0, volume - 1);
    out.textContent = Math.round(volume);
  }, 120);
</script>
</body>
</html>
